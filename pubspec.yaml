name: win98_ui
description: "A Windows 98 look-and-feel widget kit for Flutter: windows, menus, toolbars, tabs, lists, trees, dialogs, a taskbar and more. No Material or Cupertino."
version: 0.1.0
repository: https://github.com/allmonty/flutter-win98-ui
issue_tracker: https://github.com/allmonty/flutter-win98-ui/issues
topics: [ui, widget, retro, windows, theme]

screenshots:
  - description: A window with a menu bar, toolbar, tabs, controls, a status bar and a taskbar.
    path: doc/screenshots/hero.png
  - description: Menus with a submenu, checkmark and disabled item.
    path: doc/screenshots/menus.png
  - description: An Explorer-style tree view and a list view with sortable columns.
    path: doc/screenshots/explorer.png
  - description: Text fields, a drop-down, a slider and a list box.
    path: doc/screenshots/inputs.png

environment:
  sdk: ^3.11.1
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: PixelifySans
      fonts:
        - asset: fonts/PixelifySans.ttf
